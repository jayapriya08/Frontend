<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
</head>
<body>
    <form action="" method=">
        <label for="user">Full Name</label> <br>
        <input type="text" id="user" name="user" placeholder="Enter your Full Name" > 
        <br>

        <label for="u">Email address</label> <br>
        <input type="email" id="u" placeholder="Enter your Email">
        <br>

        <label for="p">Password</label> <br>
        <input type="password" placeholder="Create a Password">
        <br>

        <label for="">Confirm Password</label> <br>
        <input type="password" placeholder="Confirm your Password">
        <br>

        <label for="">Gender</label> <br>
        <input type="radio" name="gender" value="male" id="m">
        <label for="m">Male</label>
        <input type="radio" name="gender" value="female" id="fm">
        <label for="fm">Female</label>
        <input type="radio" name="gender" value="other" id="o">
        <label for="o">Other</label>
        <br>

        <label for="">Date of Birth</label> <br>
        <input type="date">

        <br>
        <label for="c">Country</label><br>
        <select name="Country" id="c">
            <option value="">Select your Country</option>
            <option value="nigeria">India</option>
            <option value="ghana">United States</option>
            <option value="kenya">Australia</option>
            <option value="southafrica">South Africa</option>
        </select>

        <label for="s">Choose your skills</label> <br>
        <input type="checkbox" name="skills" value="html">
        <label for="h">HTML</label>
        <input type="checkbox" name="skills" value="css">
        <label for="c">CSS</label>
        <input type="checkbox" name="skills" value="javascript">
        <label for="j">JavaScript</label>

        <br>

        <label for="f">Please write your feedback</label> <br>
        <textarea name="feedback" id="f" cols="30" rows="10" placeholder="Write your feedback here..."></textarea>
        <br>

        <input type="checkbox">
        <label for="terms">I agree to the terms and conditions</label>
        <br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
        
        </form> 

</body>
</html>
